name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Test Suite
      run: |
        pytest -v

    - name: Verify CLI Smoke Test
      run: |
        python cli.py interpret --ph 7.25 --pco2 20 --hco3 10 --na 140 --cl 100 --json
        python cli.py winters --hco3 10 --pco2 25 --json
        python cli.py anion-gap --na 140 --cl 100 --hco3 10 --json
        python cli.py delta-ratio --na 140 --cl 100 --hco3 10 --json
        python cli.py batch --input sample.csv --output results.csv
